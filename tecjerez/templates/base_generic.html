<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Sitio Escolar{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% if user.is_authenticated %}
    <p>Hola, {{ user.username }}</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>
    {% else %}
    <a href="{% url 'login' %}">Iniciar sesión</a>
    {% endif %}

</body>

</html>
