<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="theme-color" content="#000000" />

  <title>Modificaciones</title>

  {% load django_bootstrap5 %}
  {% bootstrap_css %}

  {% load static%}

</head>

<body>

  <header>
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="">
          <img src="{% static 'assets/images/estudiantes.png' %}" class="img-fluid"></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExample07"
          aria-controls="navbarsExample07" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarsExample07">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
              <a class="nav-link" href="#">INICIO</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Asignaturas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Docentes</a>
            </li>
          </ul>

        </div>
      </div>
    </nav>
  </header>


  <div class="container mt-5 mb-5">

    <div class="row">

      <div class="col-md-12">
        <h1 style="font-size: 28px; margin-top: 50px;" class=" text-center">SERVICIOS ESCOLARES </h1>

        <div class="page-content">
          <div class="row">
            <div class="col-md-10">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                  <li class="breadcrumb-item"><a href="/alumnos">Alumnos</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Modificar</li>
                </ol>
              </nav>

              <div class="row">

                <div class="col-md-12">

                  <div class="content-box-large">

                    <div class="panel-heading">
                      <div class="panel-title">
                        <h2>Modificar Datos</h2>
                      </div>
                    </div>

                    <div class="panel-body">
                      <section class="example mt-4">


                        <form method="POST" role="form" enctype="multipart/form-data">
                                                        <!--ENCTYPE ES IMPORTANTE -->
                          {% csrf_token %}

                          {{ form.as_p }}

                          <button type="submit" class="btn btn-success">Guardar</button>
                          <a href="/alumnos" class="btn btn-warning">Cancelar</a>
                        </form>

                      </section>

                    </div>

                  </div>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

    <hr>



    <footer class="text-muted mt-3 mb-3">
      <div align="center">
        FOOTER
      </div>
    </footer>

</body>

</body>

</html>
